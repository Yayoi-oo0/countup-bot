name: countup

on:
  schedule:
    # cron は UTC（世界標準時）で書きます。日本時間 = UTC + 9 時間
    # 毎朝 9:00（日本時間）: 記念日なら通知する（カウンターチャンネルを使っていれば、その更新も）
    # GitHub の定期実行は数分〜十数分遅れることがあるので、8:43（= UTC 23:43）に起動して 9:00 ちょうどまで待ってから送ります
    - cron: "43 23 * * *"
    # 毎晩 0:00（日本時間）: カウンターチャンネルの名前を更新する（23:43 = UTC 14:43 に起動して 0:00 まで待つ）
    - cron: "43 14 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "テスト送信する（通知日でなくても今日のカウントを送る）"
        type: boolean
        default: false
      date:
        description: "この日付として実行する（例: 2026-12-27）。空なら今日"
        type: string
        required: false
      register:
        description: "/days コマンドを Discord に登録する（最初に1回）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: 実行
        run: python3 countup.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          COUNTER_CHANNEL_ID: ${{ secrets.COUNTER_CHANNEL_ID }}
          # 定期実行のときは、この時刻（日本時間）ちょうどまで待ってから実行する（上の cron を変えたら、ここも同じ文字列に）
          COUNTUP_AT: ${{ github.event.schedule == '43 23 * * *' && '09:00' || github.event.schedule == '43 14 * * *' && '00:00' || '' }}
          # 「毎晩 0:00」の実行のときだけ true になる
          COUNTUP_COUNTER_ONLY: ${{ github.event.schedule == '43 14 * * *' }}
          COUNTUP_TEST: ${{ inputs.test }}
          COUNTUP_DATE: ${{ inputs.date }}
          COUNTUP_REGISTER: ${{ inputs.register }}
