name: countup

on:
  # 定期実行は Cloudflare Workers のタイマー（Cron Triggers）から合図を送って動かします。
  # GitHub の schedule は数時間遅れることがあったため使っていません。
  #   日本時間 8:58 → at=09:00（記念日なら 9:00 ちょうどに通知）
  #   日本時間 23:58 → at=00:00, counter_only=true（0:00 ちょうどにチャンネル名を更新）
  workflow_dispatch:
    inputs:
      at:
        description: "この時刻（日本時間、HH:MM）ちょうどまで待ってから実行する。空ならすぐ"
        type: string
        required: false
      counter_only:
        description: "チャンネル名の日数の更新だけする"
        type: boolean
        default: false
      test:
        description: "テスト送信する（通知日でなくても今日のカウントを送る）"
        type: boolean
        default: false
      date:
        description: "この日付として実行する（例: 2026-12-27）。空なら今日"
        type: string
        required: false
      register:
        description: "/days コマンドを Discord に登録する（最初に1回）"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - name: 実行
        run: python3 countup.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          COUNTER_CHANNEL_ID: ${{ secrets.COUNTER_CHANNEL_ID }}
          COUNTUP_AT: ${{ inputs.at }}
          COUNTUP_COUNTER_ONLY: ${{ inputs.counter_only }}
          COUNTUP_TEST: ${{ inputs.test }}
          COUNTUP_DATE: ${{ inputs.date }}
          COUNTUP_REGISTER: ${{ inputs.register }}
